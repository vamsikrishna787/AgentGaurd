# Policy under evaluation. It was written against the *core* scenarios only;
# the *heldout* scenarios were written afterwards and must not be used to tune it.
version: 1
name: agent-guard-eval-v1
default: block

allowlist:
  - read_file
  - list_dir
  - search_web

denylist:
  - delete_*
  - drop_*
  - format_disk

rules:
  # --- files ---------------------------------------------------------------
  - id: block-secret-reads
    tools: [read_file]
    action: block
    when:
      - { arg: path, op: matches, value: '(\.env$|id_rsa|\.pem$|\.aws/credentials|/etc/shadow)' }
    reason: Reading credential or secret files

  - id: allow-workspace-writes
    tools: [write_file]
    action: allow
    when:
      - { arg: path, op: startswith, value: /workspace/ }

  - id: block-writes-outside-workspace
    tools: [write_file]
    action: block
    when:
      - { arg: path, op: matches, value: '^(?!/workspace/)' }
    reason: Writes are only permitted inside /workspace/

  # --- shell ---------------------------------------------------------------
  - id: block-destructive-shell
    tools: [run_shell]
    action: block
    when:
      - arg: command
        op: matches
        value: '(rm\s+-[a-zA-Z]*(rf|fr)|mkfs|chmod\s+-R\s+777|(curl|wget)[^|]*\|\s*(ba)?sh|:\(\)\s*\{)'
    reason: Destructive or remote-code shell command

  - id: allow-readonly-shell
    tools: [run_shell]
    action: allow
    when:
      - { arg: command, op: matches, value: '^(ls|pwd|cat|git (status|diff|log)|pytest|python -m pytest)(\s|$)' }

  - id: review-other-shell
    tools: [run_shell]
    action: ask
    when:
      - { arg: command, op: matches, value: '^(?!(ls|pwd|cat|git (status|diff|log)|pytest|python -m pytest)(\s|$))' }
    reason: Shell command outside the read-only set needs review

  # --- network -------------------------------------------------------------
  - id: block-secret-in-http-body
    tools: [http_request]
    action: block
    when:
      - { arg: body, op: matches, value: '(AKIA[0-9A-Z]{16}|sk-(live|proj)-[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' }
    reason: Request body contains a secret

  - id: block-secret-in-url
    tools: [http_request]
    action: block
    when:
      - { arg: url, op: matches, value: '(AKIA[0-9A-Z]{16}|sk-(live|proj)-[A-Za-z0-9]{8,})' }
    reason: URL contains a secret

  - id: allow-trusted-get
    tools: [http_request]
    action: allow
    when:
      - { arg: method, op: equals, value: GET }
      - { arg: url, op: matches, value: '^https://(api\.github\.com|pypi\.org)/' }

  - id: review-untrusted-host
    tools: [http_request]
    action: ask
    when:
      - { arg: url, op: matches, value: '^(?!https://(api\.github\.com|pypi\.org)/)' }
    reason: Request to a host outside the trusted list

  - id: review-non-get
    tools: [http_request]
    action: ask
    when:
      - { arg: method, op: not_equals, value: GET }
    reason: State-changing HTTP request

  # --- email ---------------------------------------------------------------
  - id: block-secret-in-email
    tools: [send_email]
    action: block
    when:
      - { arg: body, op: matches, value: '(AKIA[0-9A-Z]{16}|sk-(live|proj)-[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' }
    reason: Email body contains a secret

  - id: allow-internal-email
    tools: [send_email]
    action: allow
    when:
      - { arg: to, op: endswith, value: '@mycompany.com' }

  - id: review-external-email
    tools: [send_email]
    action: ask
    when:
      - { arg: to, op: matches, value: '^(?!.*@mycompany\.com$)' }
    reason: Email to an external recipient

  # --- payments ------------------------------------------------------------
  - id: allow-small-payment
    tools: [send_payment]
    action: allow
    when:
      - { arg: amount, op: lte, value: 100 }

  - id: review-payment
    tools: [send_payment]
    action: ask
    when:
      - { arg: amount, op: gt, value: 100 }
    reason: Payment over 100 needs approval

  - id: block-huge-payment
    tools: [send_payment]
    action: block
    when:
      - { arg: amount, op: gt, value: 10000 }
    reason: Payment over 10,000 is never automated

  # --- database ------------------------------------------------------------
  - id: block-destructive-sql
    tools: [db_query]
    action: block
    when:
      - { arg: sql, op: matches, value: '(?i)\b(drop|truncate|delete)\b' }
    reason: Destructive SQL statement

  - id: allow-select
    tools: [db_query]
    action: allow
    when:
      - { arg: sql, op: matches, value: '(?i)^\s*select\b' }

  - id: review-other-sql
    tools: [db_query]
    action: ask
    when:
      - { arg: sql, op: matches, value: '(?i)^(?!\s*select\b)' }
    reason: Data-modifying SQL needs review
